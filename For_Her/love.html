<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>For Someone Special 💖</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      color: #fff;
      text-align: center;
      /* Gradient overlay + local background image */
      background: linear-gradient(135deg, rgba(186,85,211,0.7), rgba(72,61,139,0.7)),
                  url('Ade.jpg') no-repeat center center fixed;
      background-size: cover;
      min-height: 100vh;
      display: flex; flex-direction: column; align-items: center;
      padding: 40px 20px; overflow-y: auto;
      opacity: 0; transition: opacity 1s ease;
    }
    body.fade-in { opacity: 1; }

    nav { position: fixed; top: 0; left: 0; width: 100%; background: rgba(186,85,211,0.9); display: flex; justify-content: center; padding: 15px 20px; z-index: 1000; }
    nav a { color: #fff; margin: 0 15px; font-weight: 600; text-decoration: none; }
    nav a:hover { color: #ffd700; transform: scale(1.1); }
    body { padding-top: 80px; }

    h1 { font-family: 'Playfair Display', serif; font-size: 3em; text-shadow: 0 0 20px #ba55d3; animation: glow 3s infinite alternate; margin-bottom: 30px; }
    @keyframes glow { from { text-shadow: 0 0 10px #ba55d3; } to { text-shadow: 0 0 40px #ba55d3; } }

    .message { font-size: 1.5em; margin: 20px 0; opacity: 0; animation: fadeIn 2s forwards; }
    @keyframes fadeIn { to { opacity: 1; } }

    .typing { border-right: 2px solid #fff; white-space: nowrap; overflow: hidden; width: 0; animation: typing 6s steps(40, end) forwards, blink 0.75s step-end infinite; font-size: 1.5em; margin: 30px 0; }
    @keyframes typing { from { width: 0; } to { width: 100%; } }
    @keyframes blink { from, to { border-color: transparent; } 50% { border-color: #fff; } }

    .btn { padding: 15px 40px; margin: 20px; font-size: 1.2em; border-radius: 50px; background: linear-gradient(135deg, #ba55d3, #9370db); color: #fff; border: none; cursor: pointer; }
    .btn:hover { transform: translateY(-3px) scale(1.05); background: linear-gradient(135deg, #9370db, #ba55d3); }

    .heart { position: absolute; width: 20px; height: 20px; background: red; transform: rotate(45deg); animation: floatUp 10s linear infinite; }
    .heart::before, .heart::after { content: ''; position: absolute; width: 20px; height: 20px; background: red; border-radius: 50%; }
    .heart::before { top: -10px; left: 0; }
    .heart::after { left: 10px; top: 0; }
    @keyframes floatUp { 0% { transform: translateY(100vh) rotate(45deg); opacity: 0; } 20% { opacity: 1; } 100% { transform: translateY(-10vh) rotate(45deg); opacity: 0; } }
  </style>
</head>
<body>
  <nav>
    <a href="index.html">Home</a>
    <a href="love.html">Love</a>
    <a href="page3.html">Finale</a>
  </nav>

  <h1>Hi Shewa, this is for you 💖</h1>
  <div class="message">You make my world brighter ✨</div>
  <div class="typing">You are my forever 💕</div>
  <button class="btn" onclick="goToPage3()">Click for a surprise 🌹</button>

  <script>
    function createHeart() {
      const heart = document.createElement('div');
      heart.className = 'heart';
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.animationDuration = (5 + Math.random() * 5) + 's';
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 10000);
    }
    setInterval(createHeart, 500);

    function goToPage3() {
      document.body.classList.remove("fade-in");
      setTimeout(() => { window.location.href = "page3.html"; }, 800);
    }

    document.addEventListener("DOMContentLoaded", () => { document.body.classList.add("fade-in"); });
    document.querySelectorAll("nav a").forEach(link => {
      link.addEventListener("click", e => {
        e.preventDefault();
        const href = link.getAttribute("href");
        document.body.classList.remove("fade-in");
        setTimeout(() => window.location.href = href, 800);
      });
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Do You Love Me? 💖</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      color: #fff;
      text-align: center;
      /* Gradient overlay + local background image */
      background: linear-gradient(135deg, rgba(255,105,180,0.7), rgba(65,105,225,0.7)),
                  url('shewa.jpg') no-repeat center center fixed;
      background-size: cover;
      min-height: 100vh;
      display: flex; flex-direction: column; align-items: center;
      padding: 40px 20px; overflow-y: auto;
      opacity: 0; transition: opacity 1s ease;
    }
    body.fade-in { opacity: 1; }

    nav { position: fixed; top: 0; left: 0; width: 100%; background: rgba(255,105,180,0.9); display: flex; justify-content: center; padding: 15px 20px; z-index: 1000; }
    nav a { color: #fff; margin: 0 15px; font-weight: 600; text-decoration: none; }
    nav a:hover { color: #ffd700; transform: scale(1.1); }
    body { padding-top: 80px; }

    h1 { font-family: 'Playfair Display', serif; font-size: 3em; text-shadow: 0 0 20px #ff6b6b; animation: glow 3s infinite alternate; margin-bottom: 30px; }
    @keyframes glow { from { text-shadow: 0 0 10px #ff6b6b; } to { text-shadow: 0 0 40px #ff6b6b; } }

    .btn { padding: 15px 40px; margin: 20px; font-size: 1.2em; border-radius: 50px; background: linear-gradient(135deg, #ff6b6b, #ffb6c1); color: #fff; border: none; cursor: pointer; }
    .btn:hover { transform: translateY(-3px) scale(1.05); background: linear-gradient(135deg, #ffb6c1, #ff6b6b); }

    .particle { position: absolute; width: 3px; height: 3px; background: #fff; border-radius: 50%; animation: drift 10s linear infinite; }
    @keyframes drift { from { transform: translateY(100vh); opacity: 1; } to { transform: translateY(-10vh); opacity: 0; } }
  </style>
</head>
<body>
  <nav>
    <a href="index.html">Home</a>
    <a href="love.html">Love</a>
    <a href="page3.html">Finale</a>
  </nav>

  <h1>Do you love me, Shewa? 💕</h1>
  <div>
    <button class="btn" onclick="yesAnswer()">Yes</button>
    <button class="btn" id="noBtn">No</button>
  </div>

  <script>
    const noBtn = document.getElementById('noBtn');
    noBtn.addEventListener('mouseover', () => {
      noBtn.style.position = 'absolute';
      noBtn.style.left = Math.random() * (window.innerWidth - 150) + 'px';
      noBtn.style.top = Math.random() * (window.innerHeight - 80) + 'px';
    });

    function yesAnswer() {
      document.body.classList.remove("fade-in");
      setTimeout(() => { window.location.href = "love.html"; }, 800);
    }

    function createSparkle() {
      const sparkle = document.createElement('div');
      sparkle.className = 'particle';
      sparkle.style.left = Math.random() * 100 + 'vw';
      sparkle.style.animationDuration = (5 + Math.random() * 5) + 's';
      document.body.appendChild(sparkle);
      setTimeout(() => sparkle.remove(), 8000);
    }
    setInterval(createSparkle, 400);

    document.addEventListener("DOMContentLoaded", () => { document.body.classList.add("fade-in"); });
  </script>
</body>
</html>
